<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe · Plugins for Breakfast</title>
<meta name="robots" content="noindex">
<meta name="description" content="Stop getting emails from Plugins for Breakfast.">
<link rel="icon" href="/assets/icon.png">
<link rel="stylesheet" href="/assets/page.css">
<style>
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 24px;margin:18px 0;box-shadow:0 8px 0 var(--line)}
.card h1{margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:800;font-size:17px;border:0;border-radius:14px;padding:14px 22px;cursor:pointer;text-decoration:none;background:var(--accent);color:#fff;box-shadow:0 6px 0 #8f3a20}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
form.e{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
form.e input{flex:1 1 240px;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><a class="brand" href="/">Plugins<small>for breakfast</small></a><nav><a href="/#oc">Plugins</a><a href="/support.html">Help</a></nav></header>
<main>

<section class="card">
  <h1 id="title">Unsubscribe</h1>
  <p class="lead" id="text">Sorry to see you go. You can stop our emails here.</p>
  <div class="row" id="yesRow" hidden>
    <button class="btn" type="button" id="yes">Yes, unsubscribe me</button>
    <a class="btn ghost" href="/">Keep me on the list</a>
  </div>
  <form class="e" id="byEmail" hidden novalidate>
    <input id="email" type="email" name="email" placeholder="you@studio.com" autocomplete="email" aria-label="Your email" required>
    <button class="btn" type="submit">Unsubscribe</button>
  </form>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</section>
</main>
<footer>© 2026 Plugins for Breakfast by Escae Studios · <a href="/privacy.html">Privacy</a> · <a href="mailto:chef@pluginsforbreakfast.com">chef@pluginsforbreakfast.com</a></footer>
<script src="/config.js"></script>
<script>
// Talks to our list (CONFIG.signupEndpoint, a Google Apps Script web app) with JSONP, so it works from any browser without CORS.
function ask(params){
  return new Promise((ok, fail) => {
    if (!CONFIG.signupEndpoint) return fail(new Error('none'));
    const cb = 'pfb' + Math.random().toString(36).slice(2), s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); fail(new Error('timeout')); }, 15000);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); ok(d || {}); };
    s.onerror = () => { cleanup(); fail(new Error('network')); };
    s.src = CONFIG.signupEndpoint + '?' + new URLSearchParams({...params, callback: cb});
    document.head.appendChild(s);
  });
}
const $ = id => document.getElementById(id), token = new URLSearchParams(location.search).get('t') || '';
const show = (title, text) => { $('title').textContent = title; $('text').textContent = text; };
</script>
<script>
const done = r => { show(r.title || "You're unsubscribed", r.message || "We won't email you again. Your plugins and downloads keep working as before."); $('yesRow').hidden = $('byEmail').hidden = true; $('status').textContent = ''; };
const oops = () => { $('status').textContent = 'Something went wrong. Please try again, or write to ' + CONFIG.supportEmail + '.'; };
if (token) {
  $('yesRow').hidden = false;
  $('yes').onclick = async () => {
    $('yes').disabled = true; $('status').textContent = 'One moment...';
    try { const r = await ask({a: 'unsubscribe', t: token, yes: '1'}); r.ok ? done(r) : (show(r.title || 'That link has gone stale', r.message || 'Enter your email below instead.'), $('yesRow').hidden = true, $('byEmail').hidden = false, $('status').textContent = ''); }
    catch (e) { oops(); } finally { $('yes').disabled = false; }
  };
} else $('byEmail').hidden = false;
$('byEmail').onsubmit = async e => {
  e.preventDefault();
  const email = $('email').value.trim();
  if (!email || !$('email').checkValidity()) { $('status').textContent = 'That email looks half-baked. Check it and try again.'; return; }
  if (!CONFIG.signupEndpoint) { location.href = 'mailto:' + CONFIG.supportEmail + '?subject=Unsubscribe&body=' + encodeURIComponent('Please unsubscribe ' + email); return; }
  $('status').textContent = 'One moment...';
  const body = JSON.stringify({action: 'unsubscribe', email});
  try {
    let r = {ok: true};
    try { const res = await fetch(CONFIG.signupEndpoint, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body}); try { r = await res.json(); } catch (x) { r = {ok: res.ok}; } }
    catch (x) { await fetch(CONFIG.signupEndpoint, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body}); }
    r.ok ? done(r) : oops();
  } catch (x) { oops(); }
};
</script>
</body>
</html>
